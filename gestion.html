<style>
/* Layout: phone-first app — walnut header with save status, scrolling content, bottom tab bar; forms open as bottom sheets */
:root{
  --bg:#f1efec; --surface:#ffffff; --fg:#231c17; --muted:#6c625a; --line:#e0dad2;
  --brass:#a57a26; --brass-soft:#f3e8d2; --walnut:#3a2518; --on-dark:#f6efe4; --on-dark-muted:#cbbba7;
  --ok:#2f7d4f; --ok-soft:#e0f0e6; --warn:#b26a00; --warn-soft:#fbecd3; --bad:#b33a2e; --bad-soft:#f8e1de; --wa:#1f8f4e;
  --display:"Marcellus", Georgia, serif; --body:"Manrope","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15110e; --surface:#1f1915; --fg:#f1eae1; --muted:#a99c8e; --line:#362d26;
  --brass:#d4a64a; --brass-soft:#3a2e19; --walnut:#24170f;
  --ok:#5cc184; --ok-soft:#1c3326; --warn:#e7a24a; --warn-soft:#3a2a14; --bad:#ec7b6f; --bad-soft:#3d1f1b; --wa:#2fb06a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15110e; --surface:#1f1915; --fg:#f1eae1; --muted:#a99c8e; --line:#362d26;
  --brass:#d4a64a; --brass-soft:#3a2e19; --walnut:#24170f;
  --ok:#5cc184; --ok-soft:#1c3326; --warn:#e7a24a; --warn-soft:#3a2a14; --bad:#ec7b6f; --bad-soft:#3d1f1b; --wa:#2fb06a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
h1,h2,h3{margin:0;font-weight:400;font-family:var(--display);text-wrap:balance}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--walnut)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--walnut);color:var(--on-dark)}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--brass);display:grid;place-items:center;font-family:var(--display);color:var(--brass);font-size:14px;flex:none}
.bar h1{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar small{display:block;font-family:var(--body);font-size:11px;color:var(--on-dark-muted);letter-spacing:.06em}
.sync{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,246,220,.3);color:var(--on-dark-muted);white-space:nowrap;background:none;cursor:default}
.sync.ok{color:#9fd8b2} .sync.err{color:#ffb4a8;border-color:#ffb4a8;cursor:pointer} .sync.demo{color:#f3d58c}

main{max-width:760px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.banner{background:var(--warn-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner button{background:none;border:0;color:var(--warn);font-weight:700;cursor:pointer;padding:0;font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px;text-align:left;color:inherit;font:inherit}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi b{font-size:20px;font-weight:700}
.kpi.hl{background:var(--walnut);border-color:var(--walnut);color:var(--on-dark)}
.kpi.hl span{color:var(--on-dark-muted)}
.kpi.hl b{color:var(--brass)}

.sec{display:grid;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:22px}
.link{background:none;border:0;color:var(--brass);font-weight:700;cursor:pointer;padding:0;font-size:14px}

.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;text-align:left;width:100%;color:inherit;font:inherit;cursor:pointer}
.item.new{border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.item .r1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item .t{font-weight:700;min-width:0}
.item .s{color:var(--muted);font-size:13px;font-weight:500}
.item .amt{font-weight:700;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-n{background:var(--brass-soft);color:var(--brass)}

    <p>${first?"Vous êtes entré avec un mot de passe provisoire. Choisissez le vôtre : vous seul le connaîtrez.":"Choisissez un nouveau mot de passe."}</p>
    <form class="f" id="fp" novalidate>
      <label for="p1">Nouveau mot de passe <span class="hint">(8 caractères minimum)</span><input id="p1" type="password" autocomplete="new-password"></label>
      <label for="p2">Répétez le mot de passe<input id="p2" type="password" autocomplete="new-password"></label>
      <div class="msg m-bad" id="pmsg" hidden></div>
      <button class="btn b-main" type="submit">Enregistrer</button>
      ${first?"":'<button class="btn b-line" type="button" id="pcancel">Annuler</button>'}
    </form></div>`;
  if(!first) $("pcancel").onclick = ()=>{ $("navWrap").hidden=false; go({tab:"plus"}); };
  $("fp").onsubmit = async e=>{
    e.preventDefault();
    const a=$("p1").value, b=$("p2").value, m=$("pmsg");
    if(a.length<8){ m.textContent="Au moins 8 caractères."; m.hidden=false; return; }
    if(a!==b){ m.textContent="Les deux mots de passe ne sont pas pareils."; m.hidden=false; return; }
    const {error} = await sb.auth.updateUser({password:a, data:{must_change:false}});
    if(error){ m.textContent = /same|different/i.test(error.message) ? "Choisissez un mot de passe différent de l'ancien." : "Impossible d'enregistrer : "+error.message; m.hidden=false; return; }
    toast("Mot de passe enregistré"); boot();
  };
}
async function boot(){
  if(!sb){ vLogin("Pas de connexion internet. Vérifiez puis rechargez la page."); return; }
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ vLogin(); return; }
  if(session.user.user_metadata?.must_change){ vNewPass(true); return; }
  app.innerHTML = '<div class="empty">Chargement…</div>';
  const {data: ok, error: aerr} = await sb.rpc("mddeco_is_admin");
  if(aerr){ app.innerHTML = `<div class="card"><h2>Pas de connexion</h2><p>Vérifiez internet puis réessayez.</p><button class="btn b-main" type="button" onclick="boot()">Réessayer</button></div>`; return; }
  if(!ok){ await sb.auth.signOut(); vLogin("Ce numéro n'a pas accès à cette gestion."); return; }
  try{ await loadAll(); }catch(e){ console.error(e); app.innerHTML = `<div class="card"><h2>Pas de connexion</h2><p>Impossible de charger vos données. Vérifiez internet.</p><button class="btn b-main" type="button" onclick="boot()">Réessayer</button></div>`; return; }
  setSync("ok","Enregistré ✓");
  startApp();
}

  $("navWrap").hidden = false;
  const h = location.hash.replace("#","");
  if(["demandes","photos","vitrine"].includes(h)) view = {tab: h==="demandes"?"dm":"plus", sub: h==="demandes"?null:h};

}

function sheet(title, html, onSave, saveLbl="Enregistrer"){

function shrink(file){
  return new Promise((res, rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const k = Math.min(1, 1600/Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement("canvas"); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b=> b?res(b):rej(new Error("conversion")), "image/jpeg", 0.82); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("Format non lu")); };
    img.src = url;
  });
}
function afterPhotos(){
  let picked = [];
  const msg = (t,ok)=>{ const m=$("pmsg"); m.textContent=t; m.className="msg "+(ok?"m-ok":"m-bad"); m.hidden=!t; };
  $("pfiles").onchange = ()=>{
    picked = [...$("pfiles").files].filter(f=>f.type.startsWith("image/")).slice(0,20);
    $("pprev").innerHTML = picked.map(f=>`<img alt="" src="${URL.createObjectURL(f)}">`).join("");
    $("pup").disabled = !picked.length;
    $("pup").textContent = picked.length ? `Publier ${picked.length} photo${picked.length>1?"s":""}` : "Publier sur la vitrine";
    msg("");
  };
  $("pup").onclick = async ()=>{
    if(demo){ msg("En mode démo, les photos ne sont pas envoyées."); return; }
    const cat = $("pcat").value, leg = $("pleg").value.trim().slice(0,120) || null;
    $("pup").disabled = true; $("pprog").hidden = false; const bar = $("pprog").firstElementChild;
    let ok=0, ko=0;
    for(let i=0;i<picked.length;i++){
      try{
        const blob = await shrink(picked[i]);
        const path = `photos/${cat}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
        const {error:e1} = await sb.storage.from(BUCKET).upload(path, blob, {contentType:"image/jpeg", cacheControl:"31536000"});
        if(e1) throw e1;
        const {error:e2} = await sb.from("mddeco_photos").insert({categorie:cat, path, legende:leg});
        if(e2){ await sb.storage.from(BUCKET).remove([path]); throw e2; }
        ok++;
      }catch(e){ console.error(e); ko++; }
      bar.style.width = Math.round((i+1)/picked.length*100)+"%";
    }
    await loadPhotos(); render();
    toast(ko ? `${ok} publiée(s), ${ko} en erreur` : `${ok} photo${ok>1?"s":""} publiée${ok>1?"s":""} sur la vitrine`);
  };
  app.querySelectorAll(".ph .del").forEach(b=>b.onclick=()=>{
    const ph = b.closest(".ph"), c = document.createElement("div"); c.className="conf";
    c.innerHTML = `Supprimer cette photo ?<div><button type="button" data-y style="background:#b33a2e;color:#fff">Oui</button><button type="button" data-n>Non</button></div>`;
    ph.appendChild(c);
    c.querySelector("[data-n]").onclick = ()=>c.remove();
    c.querySelector("[data-y]").onclick = async ()=>{
      c.textContent = "Suppression…";
      const {error} = await sb.from("mddeco_photos").delete().eq("id", ph.dataset.pid);
      if(error){ c.textContent="Erreur, réessayez."; setTimeout(()=>c.remove(),1500); return; }
      await sb.storage.from(BUCKET).remove([ph.dataset.path]);
      await loadPhotos(); render(); toast("Photo supprimée");
    };
  });
}

    if(!val(form,"titre")) return "Écrivez le titre du chantier.";
    Object.assign(h,{clientId:cid,titre:val(form,"titre"),lieu:val(form,"lieu")||client(cid).lieu,montant:+val(form,"montant")||0,debut:val(form,"debut"),fin:val(form,"fin"),ouvriers:[...form.querySelectorAll('[name="ou"]:checked')].map(x=>x.value)});
    if(isNew){ S.chantiers.push(h); view={tab:"ch",id:h.id}; toast("Chantier créé"); }
  });
  wireClientSelect(form);
}
function payForm(chId){
  const open = S.chantiers.filter(h=>reste(h)>0 || h.id===chId);
  if(!open.length){ toast("Aucun chantier avec un reste à payer"); return; }
  const sel = chId || open[0].id;
  sheet("Paiement reçu", `
    <label>Chantier<select name="ch">${open.map(h=>`<option value="${h.id}" ${h.id===sel?"selected":""}>${esc(h.titre)} — reste ${F(reste(h))}</option>`).join("")}</select></label>
    <div class="two"><label>Montant (F)<input name="m" type="number" min="1" inputmode="numeric"></label><label>Date<input type="date" name="date" value="${today()}"></label></div>
    <label>Mode<select name="mode">${MODES.map(m=>`<option>${m}</option>`).join("")}</select></label>`,
  form=>{ const m = +val(form,"m"); if(!(m>0)) return "Écrivez le montant reçu.";
    S.chantiers.find(h=>h.id===val(form,"ch")).paiements.push({id:uid(),date:val(form,"date")||today(),montant:m,mode:val(form,"mode")}); toast("Paiement enregistré"); });
}
function depForm(h){
  sheet("Nouvelle dépense", `
    <label>Libellé<input name="lib" placeholder="Ex. Panneaux, bandes LED, transport…"></label>
    <div class="two"><label>Montant (F)<input name="m" type="number" min="1" inputmode="numeric"></label><label>Date<input type="date" name="date" value="${today()}"></label></div>
    <label>Type<select name="type"><option>Matériel</option><option>Transport</option><option>Main-d'œuvre</option><option>Autre</option></select></label>`,
  form=>{ const m = +val(form,"m"); if(!val(form,"lib")||!(m>0)) return "Écrivez le libellé et le montant.";
    h.depenses.push({id:uid(),date:val(form,"date")||today(),libelle:val(form,"lib"),montant:m,type:val(form,"type")}); toast("Dépense ajoutée"); });
}
function payOuvrier(oid){
  const o = ouvrier(oid);
  const L = S.chantiers.filter(h=>h.ouvriers.includes(oid)).concat(S.chantiers.filter(h=>!h.ouvriers.includes(oid)));
  if(!L.length){ toast("Créez d'abord un chantier"); return; }
  sheet("Payer "+esc(o.nom), `
    <label>Pour le chantier<select name="ch">${L.map(h=>`<option value="${h.id}">${esc(h.titre)}</option>`).join("")}</select></label>
    <div class="two"><label>Montant (F)<input name="m" type="number" min="1" inputmode="numeric"></label><label>Date<input type="date" name="date" value="${today()}"></label></div>
    <label>Pour quoi ?<input name="lib" placeholder="Ex. 3 jours de pose"></label>`,
  form=>{ const m = +val(form,"m"); if(!(m>0)) return "Écrivez le montant.";
    const h = S.chantiers.find(x=>x.id===val(form,"ch"));
    h.depenses.push({id:uid(),date:val(form,"date")||today(),libelle:`${o.nom} — ${val(form,"lib")||"paiement"}`,montant:m,type:"Main-d'œuvre",ouvrierId:oid});
    if(!h.ouvriers.includes(oid)) h.ouvriers.push(oid); toast("Paiement noté sur le chantier"); });
}
function clForm(c){
  const isNew = !c; c = c || {id:uid(),nom:"",tel:"",lieu:""};
  sheet(isNew?"Nouveau client":"Client", `
    <label>Nom<input name="nom" value="${esc(c.nom)}"></label>
    <label>Téléphone<input name="tel" inputmode="tel" value="${esc(c.tel)}" placeholder="77 000 00 00"></label>
    <label>Quartier / ville<input name="lieu" value="${esc(c.lieu)}"></label>`,
  form=>{ if(!val(form,"nom")) return "Écrivez le nom du client."; Object.assign(c,{nom:val(form,"nom"),tel:val(form,"tel"),lieu:val(form,"lieu")}); if(isNew) S.clients.push(c); toast("Client enregistré"); });
}
function ouForm(o){
  const isNew = !o; o = o || {id:uid(),nom:"",metier:"",tel:""};
  sheet(isNew?"Nouvel ouvrier":"Ouvrier", `
    <label>Nom<input name="nom" value="${esc(o.nom)}"></label>
    <label>Métier<input name="metier" value="${esc(o.metier)}" placeholder="Menuisier, électricien, poseur…"></label>
    <label>Téléphone<input name="tel" inputmode="tel" value="${esc(o.tel)}"></label>`,
  form=>{ if(!val(form,"nom")) return "Écrivez le nom."; Object.assign(o,{nom:val(form,"nom"),metier:val(form,"metier"),tel:val(form,"tel")}); if(isNew) S.ouvriers.push(o); toast("Équipe mise à jour"); });
}

/* ================= rendu ================= */
function render(){
  if(!S) return;
  renderNav();
  const t = view.tab;
  if(t==="home"){ app.innerHTML=vHome(); afterHome(); }
  else if(t==="dm"){ const d = view.id && demandes.find(x=>x.id===view.id); if(d){ app.innerHTML=vDemande(d); afterDemande(d); } else { app.innerHTML=vDemandes(); afterDemandes(); } }
  else if(t==="ch"){ const h = view.id && S.chantiers.find(x=>x.id===view.id); if(h){ app.innerHTML=vChantier(h); afterChantier(h); } else { app.innerHTML=vChantiers(); afterChantiers(); } }
  else if(t==="dv"){ const d = view.id && S.devis.find(x=>x.id===view.id); if(d){ app.innerHTML=vDevis(d); afterDevis(d); } else { app.innerHTML=vDevisList(); $("newDv").onclick=()=>devisForm(); } }
  else if(t==="plus"){
    const s = view.sub;
    if(s==="photos"){ app.innerHTML=vPhotos(); afterPhotos(); }
    else if(s==="vitrine"){ app.innerHTML=vVitrine(); afterVitrine(); }
    else if(s==="notif"){ app.innerHTML=vNotif(); afterNotif(); }
    else if(s==="clients"){ app.innerHTML=vClients(); afterClients(); }
    else if(s==="equipe"){ app.innerHTML=vEquipe(); afterEquipe(); }
    else { app.innerHTML=vPlus(); afterPlus(); }
  }
  bindItems();
}
boot();
</script>

</body>
</html>
